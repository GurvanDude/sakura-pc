<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sakura Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="preintro">
  <div id="scene" aria-hidden="true"><div class="photo"></div><div class="fx"></div></div>
  <canvas id="petals" aria-hidden="true"></canvas>

  <main class="ui">
    <header class="top">
      <button id="classic" class="ghost-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Lancement classique du PC
      </button>
      <div class="spacer"></div>
      <button id="themeBtn" class="icon-btn" type="button"></button>
      <button id="ambient" class="icon-btn" type="button" title="Musique d'ambiance" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/></svg>
      </button>
      <div class="clock"><div class="greet" id="greet"></div><div class="time" id="time"></div><div class="date" id="date"></div></div>
    </header>

    <section class="title">
      <div class="jp" id="title-jp"></div>
      <h1 id="title"></h1>
      <svg class="brush" viewBox="0 0 600 30" preserveAspectRatio="none" aria-hidden="true"><path d="M8 20 C120 8 260 6 360 12 S540 22 592 10"/></svg>
    </section>

    <section class="stage" id="stage"></section>

    <section class="panel"><div class="grid" id="grid" role="listbox"></div></section>

    <footer class="bottom">
      <div class="left"></div>
      <div class="center"></div>
      <div class="right"></div>
    </footer>
  </main>

  <div id="overlay" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="petals.js"></script>
  <script src="sfx.js"></script>
  <script src="app.js"></script>
</body>
</html>
